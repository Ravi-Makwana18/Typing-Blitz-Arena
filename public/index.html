<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, user-scalable=no">
    <meta name="description"
        content="This Speed Typing Test will give you an accurate speed test and help increase your typing speed" />

    <title>TypingBlitzArena | Test your typing speed | Typing Game</title>

    <link rel="icon" href="logo.jpg">

    <!--Bootstrap 4 -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css"
        integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">

    <link rel="stylesheet" href="styles.css">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;800&family=Source+Code+Pro:wght@300;400;500;700&family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <!-- fontawesome -->
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.3/css/all.css"
        integrity="sha384-SZXxX4whJ79/gErwcOYf+zWLeJdY/qpuqC4cAa9rOGUstPomtqpuNWT9wdPEn2fk" crossorigin="anonymous">


</head>

<body>
    <div class="container-fluid box ">
        <div class="top">
            <h1 id="heading" class="yellow"><b>Typing Blitz Arena</b></h1>
            <div class="limits-box">
                <div class="limit">
                    <a id="thirty" class="yellow" href="#">30s</a>
                    <a id="sixty" href="#">60s</a>
                </div>
                <div class="limit">
                    <a id="beg" class="yellow" href="#">beginner</a>
                    <a id="pro" href="#">pro</a>
                </div>

            </div>
        </div>

        <div class="stats center">
            <div class="stat-block if">
                <div id="timeName" class="stat-name yellow if">Time</div>
                <div id="time" class="details if ">30</div>
            </div>

            <div class="stat-block if">
                <div id="cwName" class="stat-name yellow if">Words</div>
                <div id="cw" class="details if">0</div>
            </div>

            <div class="stat-block if">
                <div id="wpmName" class="stat-name yellow if">WPM</div>
                <div id="wpm" class="details if">0</div>
            </div>

            <div class="stat-block if">
                <div id="accuracyName" class="stat-name yellow if">Accuracy</div>
                <div id="accuracy" class="details if">100%</div>
            </div>
        </div>


        <div class="text-display" id="textDisplay">

        </div>

        <div class="input-area center">
            <textarea rows="1" class="text-input" id="textInput" autofocus autocomplete="off" autocorrect="off"
                autocapitalize="off" spellcheck="false" placeholder="Start typing here..."></textarea>
        </div>

        <div class="restart-button center">
            <a id="restartBtn" class="current" href="#" title="Restart Test">
                <i class="fas fa-redo"></i>
            </a>
        </div>

        <footer class="center">
            <div>
                ©2024 Made with <span style="color: #f87171;">❤️</span> by 
                <a href="https://github.com/Ravi-Makwana18" target="_blank">Ravi Makwana</a>
            </div>
        </footer>
    </div>

    <!-- Results Modal -->
    <div id="resultsModal" class="results-modal">
        <div class="results-content">
            <h2 class="results-title">Test Complete! 🎉</h2>
            <div class="results-grid">
                <div class="result-item">
                    <div id="finalWPM" class="result-value">0</div>
                    <div class="result-label">WPM</div>
                </div>
                <div class="result-item">
                    <div id="finalAccuracy" class="result-value">100%</div>
                    <div class="result-label">Accuracy</div>
                </div>
                <div class="result-item">
                    <div id="finalCorrect" class="result-value">0</div>
                    <div class="result-label">Correct Words</div>
                </div>
                <div class="result-item">
                    <div id="finalTotal" class="result-value">0</div>
                    <div class="result-label">Total Words</div>
                </div>
            </div>
            <div class="results-actions">
                <button id="tryAgainBtn" class="results-btn">Try Again</button>
                <button id="shareBtn" class="results-btn secondary">Share Results</button>
            </div>
        </div>
    </div>

    <!-- Bootstrap script -->
    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"
        integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN"
        crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js"
        integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q"
        crossorigin="anonymous"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"
        integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <!-- My Javascript -->
    <script src="app.js"></script>
</body>

</html>
